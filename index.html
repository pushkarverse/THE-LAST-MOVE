<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE LAST MOVE</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      image-rendering: pixelated;
    }

    #crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 3px, 3px 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="crt-overlay"></div>

  <!-- Rage Cam Overlay -->
  <div id="rage-cam-overlay"
    style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
    <h2 style="color: red; font-family: monospace; margin-bottom: 10px;">INSTANT REPLAY</h2>
    <video id="rage-video" controls loop
      style="max-width: 80%; max-height: 60%; border: 2px solid red; display: none; pointer-events: auto;"></video>
    <img id="rage-img" style="max-width: 80%; max-height: 60%; border: 2px solid red; display: none;" />
    <p style="color: #AAA; font-family: monospace; font-size: 12px; margin-top: 10px;">(Auto-reloading shortly...)</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
